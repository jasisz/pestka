[rust]
# Pestka spends much of its time allocating and freeing terms; on macOS the
# system allocator cost it about 9% of its time on one thread and half of
# its memory on eight.
allocator = "mimalloc"
# A panic in Pestka is a bug that ends the check either way; without
# unwinding the compiled program carries no code to free values on the way
# out of a panic.
panic = "abort"

[[verify.costly]]
fn = "expr"
step-limit = 40000000
reason = "The law sameAsSpec fills a whole chunk of the dense expression table (65536 entries) and one more to cross into the next."
